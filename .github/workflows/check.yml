name: 檢查更正
on:
  pull_request:
    paths: ["corrections/**", "pipeline/**", "data/**", "site/**", "config.json", "requirements.txt", ".github/workflows/**"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with: {fetch-depth: 0}
      - uses: actions/setup-python@v7
        with: {python-version: "3.12", cache: pip}
      - run: pip install -r requirements.txt
      - name: 檢查這次變更的更正檔
        run: |
          base="origin/${GITHUB_BASE_REF:-main}"
          python pipeline/check_corrections.py --changed "$base" --report report.md || status=$?
          cat report.md >> "$GITHUB_STEP_SUMMARY"
          exit ${status:-0}
      - name: 完整重建（所有更正都要能套用）
        run: python pipeline/build.py --strict --no-db --out /tmp/dist
