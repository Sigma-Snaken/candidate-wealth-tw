name: 重建資料庫與網站
on:
  push:
    branches: [main]
    paths: ["corrections/**", "pipeline/**", "data/**", "site/**", "config.json", "requirements.txt", ".github/workflows/**"]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with: {python-version: "3.12", cache: pip}
      - run: pip install -r requirements.txt
      - run: python pipeline/build.py --strict --out dist
      - run: cat dist/build_report.json
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with: {path: dist}
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
